services:
  database:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: sqlserver

    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Admin1234@"
      MSSQL_PID: "Express"

    ports:
      - "1433:1433"

    volumes:
      - sqlserverdata_uni:/var/opt/mssql

volumes:
  sqlserverdata_uni:
